name: iOS

on:
  push:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test core
        run: swift test --filter FrugaRelayCoreTests

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pick an available simulator
        run: |
          pick_device() {
            xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[dev["udid"] for rt,devs in d.items() if "iOS" in rt for dev in devs if dev["name"].startswith("iPhone")]; print(ids[0] if ids else "")'
          }
          DEST_ID=$(pick_device)
          if [ -z "$DEST_ID" ]; then
            echo "No iPhone simulator found, downloading iOS platform..."
            xcodebuild -downloadPlatform iOS
            DEST_ID=$(pick_device)
          fi
          if [ -z "$DEST_ID" ]; then
            echo "Still no iPhone simulator available" >&2
            exit 1
          fi
          echo "DEST_ID=$DEST_ID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$DEST_ID"

      - name: Report runner core count
        run: |
          echo "cores: $(sysctl -n hw.ncpu)"

      - name: Test FrugaRelayTests (WKWebView, no TSan)
        # WKWebView bring-up in a host-less xctest process blocks the main
        # actor for seconds even without instrumentation. Under Thread
        # Sanitizer on this 3-core runner that stall exceeds the 120 s
        # per-test allowance, landing on a different test each attempt
        # (see #79 run history 2026-09-13..21). Run this target plain.
        # Exception tracked by FrugaInsurance/sdk#152 (a FrugaShellTransport
        # seam is the path back to TSan on this target).
        run: xcodebuild -scheme FrugaRelay -destination "id=$DEST_ID" -only-testing:FrugaRelayTests -test-timeouts-enabled YES -default-test-execution-time-allowance 120 test
        env:
          CODE_SIGNING_ALLOWED: NO

      - name: Test FrugaRelayCoreTests (Thread Sanitizer)
        # FrugaRelayCore has no WebKit bring-up, so TSan runs well inside the
        # allowance here. Both library targets build in Swift 6 language
        # mode, which already enforces actor isolation statically; TSan on
        # this target is the dynamic check for the bridge-adjacent state it
        # owns. Zero races found in any run 2026-09-13..21. Needs its own
        # instrumented build (TSan build products aren't shareable with the
        # plain build above), hence a second `xcodebuild test` rather than
        # build-for-testing/test-without-building.
        run: xcodebuild -scheme FrugaRelay -destination "id=$DEST_ID" -only-testing:FrugaRelayCoreTests -enableThreadSanitizer YES -test-timeouts-enabled YES -default-test-execution-time-allowance 120 test
        env:
          CODE_SIGNING_ALLOWED: NO
